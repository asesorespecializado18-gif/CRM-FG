<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

#crm-app {
  --bg: #EEF1EF;
  --surface: #FFFFFF;
  --sidebar: #1F4B41;
  --ink: #142722;
  --ink-soft: #5A6B65;
  --ink-faint: #8A968F;
  --muted: #8A968F;
  --primary: #1F4B41;
  --primary-soft: #E3ECE7;
  --accent: #B8823D;
  --accent-soft: #F6ECD8;
  --danger: #A8483A;
  --danger-soft: #F5E3DF;
  --border: #DCE3DF;
  --radius: 10px;
  font-family: 'Inter', sans-serif;
  color: var(--ink);
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  box-sizing: border-box;
  font-size: 14px;
  line-height: 1.45;
}
#crm-app * { box-sizing: border-box; }
#crm-app .num { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
#crm-app h1, #crm-app h2, #crm-app h3, #crm-app .display { font-family: 'Fraunces', serif; letter-spacing: -0.01em; }

#crm-app .sidebar { width: 220px; flex-shrink: 0; background: var(--sidebar); color: #F2F5F3; display: flex; flex-direction: column; padding: 22px 14px; min-height: 100vh; }
#crm-app .brand { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 600; color: #fff; padding: 0 10px 4px; letter-spacing: -0.01em; }
#crm-app .brand-sub { font-size: 11px; color: #B7CBC2; padding: 0 10px 18px; border-bottom: 1px solid rgba(255,255,255,0.14); margin-bottom: 12px; }
#crm-app .nav-group-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; color: #8FAA9E; padding: 12px 10px 5px; }
#crm-app .nav-btn { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: transparent; border: none; color: #D7E4DE; padding: 9px 10px; border-radius: 8px; font-size: 13.5px; font-family: 'Inter', sans-serif; cursor: pointer; margin-bottom: 2px; transition: background 0.15s; }
#crm-app .nav-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
#crm-app .nav-btn.active { background: #fff; color: var(--primary); font-weight: 600; }
#crm-app .nav-icon { width: 16px; text-align: center; opacity: 0.85; }
#crm-app .sidebar-foot { margin-top: auto; font-size: 11px; color: #90A79D; padding: 10px; border-top: 1px solid rgba(255,255,255,0.14); }

#crm-app .main { flex: 1; min-width: 0; padding: 28px 34px 60px; max-width: 1200px; }
#crm-app .page-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
#crm-app .page-head h1 { font-size: 25px; margin: 0 0 3px; color: var(--ink); }
#crm-app .page-head p { margin: 0; color: var(--ink-soft); font-size: 13px; }

#crm-app .btn { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); cursor: pointer; transition: all 0.12s; }
#crm-app .btn:hover { border-color: var(--primary); color: var(--primary); }
#crm-app .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
#crm-app .btn-primary:hover { background: #163a32; color: #fff; }
#crm-app .btn-ghost { border-color: transparent; background: transparent; padding: 6px 8px; }
#crm-app .btn-sm { padding: 5px 10px; font-size: 12px; }
#crm-app .btn-danger-ghost { color: var(--danger); border-color: transparent; background: transparent; }

#crm-app .grid { display: grid; gap: 14px; }
#crm-app .stat-row { grid-template-columns: repeat(4, 1fr); margin-bottom: 18px; }
#crm-app .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
#crm-app .stat-card .label { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); margin-bottom: 6px; }
#crm-app .stat-card .value { font-family: 'Fraunces', serif; font-size: 24px; font-weight: 600; color: var(--ink); }
#crm-app .stat-card .delta { font-size: 11.5px; margin-top: 4px; }
#crm-app .stat-card .delta.up { color: var(--primary); }
#crm-app .stat-card .delta.down { color: var(--danger); }
#crm-app .stat-card .accent-bar { height: 3px; width: 30px; background: var(--accent); border-radius: 2px; margin-bottom: 10px; }

#crm-app .panel-title { font-size: 15px; font-weight: 600; font-family: 'Fraunces', serif; margin: 0 0 2px; }
#crm-app .panel-sub { font-size: 12px; color: var(--ink-faint); margin: 0 0 14px; }

#crm-app table { width: 100%; border-collapse: collapse; font-size: 13px; }
#crm-app th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-faint); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
#crm-app td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
#crm-app tr:last-child td { border-bottom: none; }
#crm-app tr:hover td { background: #FAFBFA; }
#crm-app .empty-row td { text-align: center; padding: 30px 10px; color: var(--ink-faint); }
#crm-app .folio { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-faint); }

#crm-app .pill { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
#crm-app .pill-green { background: var(--primary-soft); color: var(--primary); }
#crm-app .pill-gold { background: var(--accent-soft); color: #8C611F; }
#crm-app .pill-red { background: var(--danger-soft); color: var(--danger); }
#crm-app .pill-gray { background: #EEF0EF; color: var(--ink-soft); }

#crm-app .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
#crm-app select, #crm-app input[type=text], #crm-app input[type=number], #crm-app input[type=date], #crm-app textarea {
  font-family: 'Inter', sans-serif; font-size: 13px; padding: 7px 10px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); color: var(--ink);
}
#crm-app select:focus, #crm-app input:focus, #crm-app textarea:focus { outline: 2px solid var(--primary); outline-offset: 0; border-color: var(--primary); }
#crm-app ::placeholder { color: var(--ink-faint); opacity: 1; }
#crm-app select option { background: var(--surface); color: var(--ink); }
#crm-app select optgroup { background: var(--surface); color: var(--ink-soft); font-weight: 700; }
#crm-app label { font-size: 12px; font-weight: 600; color: var(--ink-soft); display: block; margin-bottom: 4px; }
#crm-app .field { margin-bottom: 12px; }
#crm-app .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

#crm-app .modal-backdrop { position: fixed; inset: 0; background: rgba(20,39,34,0.45); display: flex; align-items: flex-start; justify-content: center; padding: 40px 20px; overflow-y: auto; z-index: 50; }
#crm-app .modal { background: #fff; border-radius: 12px; width: 100%; max-width: 580px; padding: 24px 26px 22px; }
#crm-app .modal h2 { font-size: 18px; margin: 0 0 4px; }
#crm-app .modal .modal-hint { font-size: 12px; color: var(--ink-faint); margin: 0 0 16px; }
#crm-app .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }

#crm-app .chart-wrap { position: relative; height: 235px; }
#crm-app .two-col { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
#crm-app .hint { font-size: 12px; color: var(--ink-faint); margin-top: 2px; }
#crm-app .divider { height: 1px; background: var(--border); margin: 16px 0; }
#crm-app .kpi-inline { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 4px; }
#crm-app .kpi-inline div { font-size: 12px; color: var(--ink-soft); }
#crm-app .kpi-inline b { font-family: 'IBM Plex Mono', monospace; color: var(--ink); }
#crm-app .banner { background: var(--accent-soft); border: 1px solid #E9D6AE; color: #6E4E1D; padding: 10px 14px; border-radius: 8px; font-size: 12.5px; margin-bottom: 16px; }
#crm-app .link-inline { color: var(--primary); text-decoration: underline; cursor: pointer; font-size: 12.5px; }

#crm-app[data-theme="dark"] {
  --bg: #0F1E19;
  --surface: #172A22;
  --sidebar: #0A1712;
  --ink: #EAF2ED;
  --ink-soft: #B7C9C0;
  --ink-faint: #9FBBAF;
  --muted: #9FBBAF;
  --primary: #3E9179;
  --primary-soft: #1E362C;
  --accent: #D9A85E;
  --accent-soft: #3A2E18;
  --danger: #E2836F;
  --danger-soft: #3B241E;
  --border: #274236;
}
#crm-app[data-theme="dark"] .nav-btn.active { background: var(--primary); color: #fff; }
#crm-app[data-theme="dark"] .btn-primary:hover { background: #4FA98D; }
#crm-app[data-theme="dark"] tr:hover td { background: rgba(255,255,255,0.03); }
#crm-app[data-theme="dark"] .pill-gray { background: rgba(255,255,255,0.08); }
#crm-app[data-theme="dark"] .pill-gold { color: var(--accent); }
#crm-app[data-theme="dark"] .banner { border-color: var(--accent); color: var(--accent); }
#crm-app[data-theme="dark"] .modal { background: var(--surface); border: 1px solid var(--border); }
#crm-app[data-theme="dark"] select, #crm-app[data-theme="dark"] input, #crm-app[data-theme="dark"] textarea { background: var(--surface); }
#crm-app .theme-toggle { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); color: #F2F5F3; padding: 8px 10px; border-radius: 8px; font-size: 12.5px; cursor: pointer; margin-top: 8px; }
#crm-app .theme-toggle:hover { background: rgba(255,255,255,0.12); }
#crm-app .login-wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
#crm-app .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 32px 30px; width: 100%; max-width: 380px; }
#crm-app .login-card h1 { font-family: 'Fraunces', serif; font-size: 22px; margin: 0 0 4px; color: var(--ink); }
#crm-app .login-card p { font-size: 12.5px; color: var(--ink-faint); margin: 0 0 20px; }
#crm-app .login-error { background: var(--danger-soft); color: var(--danger); font-size: 12.5px; padding: 8px 10px; border-radius: 7px; margin-bottom: 12px; }

@media (max-width: 900px) {
  #crm-app { flex-direction: column; }
  #crm-app .sidebar { width: 100%; min-height: auto; flex-direction: row; overflow-x: auto; padding: 10px; }
  #crm-app .brand, #crm-app .brand-sub, #crm-app .sidebar-foot, #crm-app .nav-group-label { display: none; }
  #crm-app .nav-btn { flex-shrink: 0; }
  #crm-app .main { padding: 18px; }
  #crm-app .stat-row, #crm-app .two-col, #crm-app .field-row { grid-template-columns: 1fr; }
}
</style>

function normalizarTelefonoPeru(tel){
  let n = String(tel||'').replace(/[^\d]/g,'');
  if(!n) return '';
  if(n.startsWith('51') && n.length>=11) return n;
  if(n.startsWith('0')) n = n.slice(1);
  if(n.length===9) return '51'+n;
  return n;
}
function linkWhatsApp(telefono, mensaje){
  const n = normalizarTelefonoPeru(telefono);
  const base = n ? `https://wa.me/${n}` : `https://wa.me/`;
  return `${base}?text=${encodeURIComponent(mensaje)}`;
}

function comisionAsesor(v){
  if(v.tipoComisionAsesor==='porcentaje') return (Number(v.comisionTotal)||0) * (Number(v.valorComisionAsesor)||0) / 100;
  if(v.tipoComisionAsesor==='fijo') return Number(v.valorComisionAsesor)||0;
  return 0;
}
function comisionFG(v){ return (Number(v.comisionTotal)||0) * ((Number(v.porcentajeFG)||70)/100); }
function comisionEmpresa(v){ return comisionFG(v) - comisionAsesor(v); }
function comisionTotalSoles(v){ return v.moneda==='USD' ? (Number(v.comisionTotal)||0)*(Number(state.tipoCambio)||1) : (Number(v.comisionTotal)||0); }
function comisionAsesorSoles(v){ return v.moneda==='USD' ? comisionAsesor(v)*(Number(state.tipoCambio)||1) : comisionAsesor(v); }
function comisionFGSoles(v){ return v.moneda==='USD' ? comisionFG(v)*(Number(state.tipoCambio)||1) : comisionFG(v); }
function comisionEmpresaSoles(v){ return comisionFGSoles(v) - comisionAsesorSoles(v); }
function resumenComisiones(ventas){
  let asesorPEN=0, asesorUSD=0, fgPEN=0, fgUSD=0;
  ventas.forEach(v=>{
    if(v.moneda==='USD'){ asesorUSD += comisionAsesor(v); fgUSD += comisionFG(v); }
    else { asesorPEN += comisionAsesor(v); fgPEN += comisionFG(v); }
  });
  return { asesorPEN, asesorUSD, fgPEN, fgUSD, netoPEN: fgPEN-asesorPEN, netoUSD: fgUSD-asesorUSD };
}

function hashSimple(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (Math.imul(31,h) + str.charCodeAt(i)) | 0; }
  return 'h' + (h>>>0).toString(36);
}

let gDriveAccessToken = null;
let gDriveTokenExpiry = 0;

function obtenerTokenDrive(){
  return new Promise((resolve, reject)=>{
    if(!window.google || !google.accounts || !google.accounts.oauth2){ reject(new Error('La librería de Google no cargó (revisa tu conexión a internet y que el CRM esté abierto desde la dirección web, no como archivo local).')); return; }
    if(gDriveAccessToken && Date.now() < gDriveTokenExpiry - 60000){ resolve(gDriveAccessToken); return; }
    try{
      const client = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/drive.file',
        callback: (resp) => {
          if(resp && resp.access_token){
            gDriveAccessToken = resp.access_token;
            gDriveTokenExpiry = Date.now() + (Number(resp.expires_in)||3600)*1000;
            resolve(gDriveAccessToken);
          } else {
            reject(new Error('No se pudo obtener autorización de Google Drive.'));
          }
        },
        error_callback: (err) => reject(new Error(err && err.type ? err.type : 'Autorización cancelada.')),
      });
      client.requestAccessToken({ prompt: gDriveAccessToken ? '' : 'consent' });
    }catch(err){ reject(err); }
  });
}

async function subirRespaldoADrive(nombreArchivo, contenidoTexto){
  const token = await obtenerTokenDrive();
  const metadata = { name: nombreArchivo, mimeType: 'application/json' };
  const boundary = 'crmfgboundary' + Date.now();
  const delimiter = "\r\n--" + boundary + "\r\n";
  const closeDelim = "\r\n--" + boundary + "--";
  const body = delimiter +
    'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
    JSON.stringify(metadata) +
    delimiter +
    'Content-Type: application/json\r\n\r\n' +
    contenidoTexto +
    closeDelim;
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'multipart/related; boundary="' + boundary + '"' },
    body
  });
  if(!res.ok){ const t = await res.text(); throw new Error('Google respondió con error ' + res.status + '.'); }
  return res.json();
}

async function descargarRespaldo(){
  const payload = JSON.stringify(state, null, 2);
  const fecha = todayISO();
  const nombreArchivo = `respaldo-crm-fg-${fecha}.json`;

  const blob = new Blob([payload], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nombreArchivo;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  const btn = document.getElementById('btnDescargarRespaldo');
  const textoOriginal = btn ? btn.innerHTML : '';
  try{
    if(btn) btn.innerHTML = '⬆ Subiendo a Drive…';
    await subirRespaldoADrive(nombreArchivo, payload);
    if(btn){ btn.innerHTML = '✓ Guardado en Drive'; setTimeout(()=>{ btn.innerHTML = textoOriginal; }, 2500); }
  }catch(err){
    console.error(err);
    if(btn) btn.innerHTML = textoOriginal;
    alert('El respaldo se descargó a tu computadora, pero no se pudo subir automáticamente a Google Drive.\n\nMotivo: ' + err.message + '\n\nPuedes intentarlo de nuevo con el botón, o subir manualmente el archivo que se descargó.');
  }
}

function restaurarRespaldo(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try{ data = JSON.parse(reader.result); }
    catch(err){ alert('El archivo no es un respaldo válido (JSON dañado).'); return; }
    if(!data || !Array.isArray(data.ventas) || !Array.isArray(data.clientes)){ alert('El archivo no tiene el formato de un respaldo de este CRM.'); return; }
    if(!confirm('Esto reemplazará TODOS los datos actuales del CRM con los del respaldo seleccionado. ¿Continuar?')) return;
    state = data;
    if(!state.tema) state.tema = 'claro';
    if(!state.auth) state.auth = { email:'asesorespecializado18@gmail.com', passwordHash:null };
    save();
    checkAuthAndRender();
    alert('Respaldo restaurado correctamente.');
  };
  reader.readAsText(file);
  e.target.value = '';
}

    const k = monthKey(v.fechaVenta);
    if(!k) return;
    if(!map[k]) map[k] = { total:0, empresa:0, asesor:0, count:0, nuevas:0, renovaciones:0, totalUSD:0, empresaUSD:0, asesorUSD:0 };
    map[k].total += comisionTotalSoles(v);
    map[k].empresa += comisionEmpresaSoles(v);
    map[k].asesor += comisionAsesorSoles(v);
    map[k].count += 1;
    if(v.moneda==='USD'){
      map[k].totalUSD += Number(v.comisionTotal)||0;
      map[k].empresaUSD += comisionEmpresa(v);
      map[k].asesorUSD += comisionAsesor(v);
    }
    if(v.tipoVenta==='nueva') map[k].nuevas += 1; else if(v.tipoVenta==='renovacion') map[k].renovaciones += 1;
  });
  return map;
}

function produccionMes(key){
  const out = { primaNetaPEN:0, primaNetaUSD:0, comisionPEN:0, comisionUSD:0 };
  state.ventas.filter(v=> ventaSeguroActiva(v) && monthKey(v.fechaVenta)===key).forEach(v=>{
    const usd = v.moneda==='USD';
    if(usd){ out.primaNetaUSD += Number(v.primaNeta)||0; out.comisionUSD += Number(v.comisionTotal)||0; }
    else { out.primaNetaPEN += Number(v.primaNeta)||0; out.comisionPEN += Number(v.comisionTotal)||0; }
  });
  return out;
}

function ingresosPorCategoria(ventasFiltradas){
  const out = { seguroPEN:0, seguroUSD:0 };
  ventasFiltradas.filter(v=>esSeguro(v.tipoProducto)).forEach(v=>{
    const monto = Number(v.comisionTotal)||0;
    if(v.moneda==='USD') out.seguroUSD += monto; else out.seguroPEN += monto;
  });
  return out;
}

function alertasPendientes(){
  const ventas = misVentas(state.ventas).filter(ventaSeguroActiva);
  const cuotasAtrasadas = ventas.filter(v=>{
    if(!(v.formaPago==='cupones' || v.formaPago==='debito_automatico')) return false;
    if(v.cuotasAlDia===false) return true;
    if(v.proximaCuotaFecha && daysUntil(v.proximaCuotaFecha) < 0) return true;
    return false;
  });
  const porVencer = ventas.filter(v=> v.vigenciaFin && daysUntil(v.vigenciaFin)>=0 && daysUntil(v.vigenciaFin)<=30);
  return { cuotasAtrasadas, porVencer };
}

function renderRanking(curKey){
  const asesoresConDatos = state.asesores.map(a=>{
    const ventas = state.ventas.filter(v=> v.asesorId===a.id && ventaSeguroActiva(v) && (rankingPeriodo==='mes' ? monthKey(v.fechaVenta)===curKey : true));
    const comisionOrden = ventas.reduce((s,v)=>s+comisionAsesorSoles(v),0);

    const comisionUSD = ventas.filter(v=>v.moneda==='USD').reduce((s,v)=>s+comisionAsesor(v),0);
    return { a, count: ventas.length, comisionOrden, comisionPEN, comisionUSD };
  }).sort((x,y)=> y.comisionOrden - x.comisionOrden);

  if(asesoresConDatos.length===0) return `<div class="hint">Aún no hay asesores registrados.</div>`;
  const medals = ['🥇','🥈','🥉'];
  return `<table><thead><tr><th></th><th>Asesor</th><th># Ventas</th><th>Comisión S/.</th><th>Comisión US$</th></tr></thead><tbody>
    ${asesoresConDatos.map((r,i)=> `<tr>

      <td class="num">${fmtMoney(r.comisionPEN)}</td>
      <td class="num">${fmtUSD(r.comisionUSD)}</td>
    </tr>`).join('')}
  </tbody></table>`;
}

let filtroVProducto='todos', filtroVAsesor='todos', filtroVEstado='todas', filtroVTexto='', filtroVCanal='todos', filtroVMes='todos', filtroVAnio='todos';

function esOncologico(tipoProducto){ return prodInfo(tipoProducto).grupo === 'oncologico'; }
function esAsesoria(tipoProducto){ return prodInfo(tipoProducto).grupo === 'asesoria'; }
function bitacoraDeTab(){
  if(tab==='ventas_oncologicos') return 'oncologicos';
  if(tab==='ventas_asesorias') return 'asesorias';
  return 'seguros';
}
function ventaPerteneceABitacora(v, bit){
  if(bit==='oncologicos') return esOncologico(v.tipoProducto);
  if(bit==='asesorias') return esAsesoria(v.tipoProducto);
  return esSeguro(v.tipoProducto) && !esOncologico(v.tipoProducto) && !esAsesoria(v.tipoProducto);
}

function filteredVentas(){
  const bit = bitacoraDeTab();
  let rows = misVentas(state.ventas.slice()).filter(v=> ventaPerteneceABitacora(v, bit)).sort((a,b)=> (b.fechaVenta||'').localeCompare(a.fechaVenta||'') || b.folio-a.folio);
  if(filtroVProducto!=='todos') rows = rows.filter(v=>v.tipoProducto===filtroVProducto);
  if(filtroVAsesor!=='todos') rows = rows.filter(v=>v.asesorId===filtroVAsesor);

function viewPolizas(){

  else if(filtroPolEstado==='vencidas') rows = rows.filter(v=> daysUntil(v.vigenciaFin) < 0);

        <div class="value num" style="color:#fff;">${totalPorVencer}</div>
        <div class="hint" style="color:rgba(255,255,255,0.75);">pólizas próximas a renovar</div>
      </div>
    </div>
    <div class="toolbar">
      <select id="fPolEstado">
        <option value="todas" ${filtroPolEstado==='todas'?'selected':''}>Todas las vigencias</option>
        <option value="vigentes" ${filtroPolEstado==='vigentes'?'selected':''}>Vigentes</option>
        <option value="por_vencer" ${filtroPolEstado==='por_vencer'?'selected':''}>Por vencer (30 días)</option>
        <option value="vencidas" ${filtroPolEstado==='vencidas'?'selected':''}>Vencidas</option>
      </select>
      <select id="fPolCuota">
        <option value="todas" ${filtroPolCuota==='todas'?'selected':''}>Todas las cuotas</option>
        <option value="atrasadas" ${filtroPolCuota==='atrasadas'?'selected':''}>Con cuotas atrasadas</option>
        <option value="al_dia" ${filtroPolCuota==='al_dia'?'selected':''}>Cuotas al día</option>
      </select>
    </div>
    <div class="card" style="padding:0;">
      <table>
        <thead><tr><th>N° póliza</th><th>Cliente</th><th>Aseguradora</th><th>Producto</th><th>Vigencia</th><th>Forma de pago</th><th>Próxima cuota</th><th>Estado cuotas</th><th></th></tr></thead>
        <tbody>
          ${rows.length===0 ? `<tr class="empty-row"><td colspan="9">No hay pólizas que coincidan con el filtro.</td></tr>` : rows.map(v=>{
            const cli = state.clientes.find(c=>c.id===v.clienteId);
            const d = v.vigenciaFin ? daysUntil(v.vigenciaFin) : null;
            let vigenciaPill = '<span class="pill pill-gray">—</span>';
            if(d!==null){
              if(d<0) vigenciaPill = `<span class="pill pill-red">Vencida</span>`;

              else vigenciaPill = `<span class="pill pill-green">Vigente</span>`;
            }
            const enCuotas = v.formaPago==='cupones' || v.formaPago==='debito_automatico';
            const atrasada = conCuotasVencidas(v);
            const cuotaPill = !enCuotas ? '<span class="pill pill-gray">Al contado</span>' : (atrasada ? '<span class="pill pill-red">Atrasada</span>' : '<span class="pill pill-green">Al día</span>');

              <td>${cli?cli.nombre:'—'}</td>
              <td>${v.aseguradora||'—'}</td>

      </table>
    </div>
  `;
}

      const total = props.reduce((s,v)=>s+comisionAsesorSoles(v),0);
      return [a.nombre, a.telefono||'', a.email||'', props.length, total];
    });
    exportExcel('asesores.xlsx', headers, rows);
  };

  document.querySelectorAll('[data-edit-asesor]').forEach(b=> b.onclick = ()=>{ editing={type:'asesor', id:b.dataset.editAsesor}; render(); });
}

function wireClientes(){
  const fp = document.getElementById('fClienteProducto'); if(fp) fp.onchange = e=>{ filtroClienteProducto=e.target.value; render(); };
  const fc = document.getElementById('fClienteContacto'); if(fc) fc.onchange = e=>{ filtroClienteContacto=e.target.value; render(); };
  const btnEx = document.getElementById('btnExportClientes'); if(btnEx) btnEx.onclick = () => {
    const headers = ['Nombre / Razón social','Documento','Dirección','Ciudad','Celular 1','Celular 2','Correo 1','Correo 2','Marca','Modelo','Año','Suma Asegurada','Placa','Motor','Serie','Uso del vehículo','Aseguradora','N° Póliza','Inicio vigencia','Forma de pago','Banco endosatario','Producto','Estado de contacto','OBS','# Ventas'];
    const rows = state.clientes.map(c=>{
      const n = state.ventas.filter(v=>v.clienteId===c.id).length;
      const tipo = TIPOS_SEGURO_CLIENTE.find(t=>t.id===c.tipoSeguro);
      const est = ESTADOS_CONTACTO.find(e=>e.id===(c.estadoContacto||'nuevo'));
      return [c.nombre, c.documento||'', c.direccion||'', c.ciudad||'', c.celular1||c.telefono||'', c.celular2||'', c.email||'', c.email2||'', c.vehiculoMarca||'', c.vehiculoModelo||'', c.vehiculoAnio||'', c.sumaAsegurada||'', c.placa||'', c.motor||'', c.chasis||'', c.usoVehiculo||'', c.aseguradoraPreferida||'', c.numeroPoliza||'', c.inicioVigencia||'', c.formaPago||'', c.bancoEndosatario||'', tipo?tipo.label:'', est?est.label:'', c.datosAdicionales||'', n];
    });
    exportExcel('clientes.xlsx', headers, rows);
  };
  const btnPlantilla = document.getElementById('btnPlantillaClientes'); if(btnPlantilla) btnPlantilla.onclick = () => {
    const headers = ['Nombre / Razón social','DNI/RUC','Dirección','Ciudad','Celular 1','Celular 2','Correo 1','Correo 2','Marca','Modelo','Año','Suma Asegurada','Placa','Motor','Serie','Uso del vehículo','Aseguradora','N° Póliza','Inicio vigencia','Forma de pago','Banco Endosatario','Producto','OBS'];
    const ejemplo = ['Textiles Andinos SAC', '20481234567', 'Av. Argentina 1234, Lima', 'Lima', '999888777', '', 'contacto@ejemplo.com', '', 'Toyota', 'Corolla', '2022', '25000', 'ABC-123', 'MT12345', 'SR98765', 'Particular', 'Rímac Seguros', 'RG-00123', '2026-08-01', 'Cupones', 'BBVA', 'Vehicular', 'Cliente referido'];
    exportExcel('plantilla-carga-clientes.xlsx', headers, [ejemplo]);
  };
  const btn = document.getElementById('btnNuevoCliente'); if(btn) btn.onclick = ()=>{ editing={type:'cliente', id:null}; render(); };
  document.querySelectorAll('[data-edit-cliente]').forEach(b=> b.onclick = ()=>{ editing={type:'cliente', id:b.dataset.editCliente}; render(); });

  const btnCarga = document.getElementById('btnCargaMasiva');
  const inputCarga = document.getElementById('inputCargaMasivaClientes');
  if(btnCarga && inputCarga){
    btnCarga.onclick = () => inputCarga.click();
    inputCarga.onchange = (e) => {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try{
          const wb = XLSX.read(ev.target.result, { type:'binary' });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const filas = XLSX.utils.sheet_to_json(ws, { defval:'' });
          if(!filas.length){ alert('El archivo no tiene filas de datos.'); return; }
          const norm = s => String(s||'').toLowerCase().trim();
          const buscar = (fila, ...claves) => {
            for(const key of Object.keys(fila)){
              const k = norm(key);
              if(claves.some(c=>k.includes(c))) return String(fila[key]||'').trim();
            }
            return '';
          };
          const buscarProducto = (fila) => {
            const txt = norm(buscar(fila, 'producto', 'tipo de seguro', 'tipo seguro', 'ramo'));
            if(!txt) return '';
            const match = TIPOS_SEGURO_CLIENTE.find(t=> txt.includes(norm(t.label)) || txt.includes(t.id));
            return match ? match.id : '';
          };
          let creados=0, actualizados=0, omitidos=0;
          filas.forEach(fila => {
            const nombre = buscar(fila, 'nombre', 'razón', 'razon');
            if(!nombre){ omitidos++; return; }
            const documento = buscar(fila, 'documento', 'dni', 'ruc');
            const data = {
              nombre,
              documento,
              celular1: buscar(fila, 'celular 1', 'celular1', 'telefono', 'teléfono', 'celular'),
              celular2: buscar(fila, 'celular 2', 'celular2'),
              email: buscar(fila, 'correo 1', 'correo1', 'correo', 'email'),
              email2: buscar(fila, 'correo 2', 'correo2'),
              direccion: buscar(fila, 'dirección', 'direccion'),
              ciudad: buscar(fila, 'ciudad'),
              personaContacto: buscar(fila, 'persona de contacto', 'contacto'),
              tipoSeguro: buscarProducto(fila),
              aseguradoraPreferida: buscar(fila, 'aseguradora'),
              numeroPoliza: buscar(fila, 'n° póliza', 'n poliza', 'poliza', 'nro poliza'),
              inicioVigencia: buscar(fila, 'inicio vigencia', 'vigencia'),
              formaPago: buscar(fila, 'forma de pago', 'forma pago'),
              vehiculoMarca: buscar(fila, 'marca'),
              vehiculoModelo: buscar(fila, 'modelo'),
              vehiculoAnio: buscar(fila, 'año', 'anio'),
              sumaAsegurada: buscar(fila, 'suma asegurada'),
              placa: buscar(fila, 'placa'),
              motor: buscar(fila, 'motor'),
              chasis: buscar(fila, 'serie', 'chasis'),
              usoVehiculo: buscar(fila, 'uso del vehiculo', 'uso vehiculo', 'uso'),
              bancoEndosatario: buscar(fila, 'banco endosatario', 'banco'),
              datosAdicionales: buscar(fila, 'obs', 'observaciones', 'datos adicionales'),
            };
            const existente = documento ? state.clientes.find(c=>c.documento && c.documento===documento) : null;
            if(existente){ Object.assign(existente, data); actualizados++; }
            else { data.id = uid(); state.clientes.push(data); creados++; }
          });
          save();
          render();
          alert(`Carga masiva completada:\n• ${creados} clientes nuevos\n• ${actualizados} actualizados (mismo documento)\n${omitidos ? `• ${omitidos} filas omitidas (sin nombre)` : ''}`);
        }catch(err){
          console.error(err);
          alert('No se pudo leer el archivo. Verifica que sea un Excel (.xlsx) y que tenga la columna "Nombre".');
        }
        inputCarga.value = '';
      };
      reader.readAsBinaryString(file);
    };
  }
}

function wireModal(){
  const cancel = document.getElementById('mCancel'); if(cancel) cancel.onclick = closeModal;
  const del = document.getElementById('mDelete'); if(del) del.onclick = () => {
    if(editing.type==='venta'){ state.ventas = state.ventas.filter(v=>v.id!==editing.id); state.polizas = state.polizas.filter(p=>p.ventaId!==editing.id); }
    if(editing.type==='poliza') state.polizas = state.polizas.filter(p=>p.id!==editing.id);
    if(editing.type==='asesor') state.asesores = state.asesores.filter(a=>a.id!==editing.id);
    if(editing.type==='cliente') state.clientes = state.clientes.filter(c=>c.id!==editing.id);
    save(); closeModal(); render();
  };

  if(editing.type==='cliente'){
    const tipoSeguroSel = document.getElementById('mTipoSeguro');
    const bloqueVehiculo = document.getElementById('mBloqueVehiculo');
    if(tipoSeguroSel && bloqueVehiculo){
      tipoSeguroSel.onchange = () => { bloqueVehiculo.style.display = tipoSeguroSel.value==='vehicular' ? '' : 'none'; };
    }
  }

  if(editing.type==='venta'){
    const esAsesoriaModalJS = bitacoraDeTab()==='asesorias';
    const tipoSel = document.getElementById('mTipoComAsesor');
    const valorInput = document.getElementById('mValorComAsesor');
    const label = document.getElementById('mValorLabel');
    const hint = document.getElementById('mCalcHint');
    const totalInput = document.getElementById('mComisionTotal');
    const monedaSel = document.getElementById('mMoneda');
    const prodSel = document.getElementById('mProducto');
    const bloqueSeguro = document.getElementById('mBloqueSeguro');
    const bloqueFijo = document.getElementById('mBloqueFijo');
    const fieldsVigencia = document.getElementById('mFieldsVigencia');
    const primaBrutaInput = document.getElementById('mPrimaBruta');
    const pctAseguradoraInput = document.getElementById('mPctAseguradora');
    const modoComAseguradoraSel = document.getElementById('mModoComAseguradora');
    const filaPctAseguradora = document.getElementById('mFilaPctAseguradora');
    const filaComisionFijaSeguro = document.getElementById('mFilaComisionFijaSeguro');
    const comisionAseguradoraFijaInput = document.getElementById('mComisionAseguradoraFija');
    const primaNetaLabelEl = document.getElementById('mPrimaNetaLabel');
    const primaNetaValorEl = document.getElementById('mPrimaNetaValor');
    const comisionEmpresaValorEl = document.getElementById('mComisionEmpresaValor');
    const comisionAsesorValorEl = document.getElementById('mComisionAsesorValor');
    const vigenciaInicioInput = document.getElementById('mVigenciaInicio');
    const vigenciaFinInput = document.getElementById('mVigenciaFin');
    const pctFGSel = document.getElementById('mPctFG');

    const polizaPDFInput = document.getElementById('mPolizaPDF');
    if(polizaPDFInput) polizaPDFInput.onchange = () => {
      const file = polizaPDFInput.files[0];
      if(!file) return;
      if(file.size > 1.5*1024*1024){ alert('El archivo pesa más de 1.5 MB. Elige un PDF más liviano — todo el sistema comparte 5 MB de almacenamiento.'); polizaPDFInput.value=''; return; }
      const reader = new FileReader();
      reader.onload = () => {
        pendingPolizaPDF = { name: file.name, dataUrl: reader.result };
        const info = document.getElementById('mPolizaPDFInfo');
        if(info) info.innerHTML = `📄 ${file.name} — se guardará al hacer clic en Guardar.`;
      };
      reader.readAsDataURL(file);
    };
    const quitarPDF = document.getElementById('mPolizaPDFQuitar');
    if(quitarPDF) quitarPDF.onclick = (e) => {
      e.preventDefault();
      pendingPolizaPDF = null;
      const info = document.getElementById('mPolizaPDFInfo');
      if(info) info.innerHTML = 'Sin archivo adjunto.';
      if(polizaPDFInput) polizaPDFInput.value = '';
    };

    const modoAseguradoraEsFijo = () => modoComAseguradoraSel && modoComAseguradoraSel.value==='fijo';

    const comisionTotalActual = () => {
      if(esSeguro(prodSel.value)){
        if(modoAseguradoraEsFijo()) return parseFloat(comisionAseguradoraFijaInput.value)||0;
        const primaNeta = calcPrimaNeta(primaBrutaInput.value);
        const pct = parseFloat(pctAseguradoraInput.value)||0;
        return primaNeta * pct / 100;
      }
      return parseFloat(totalInput.value)||0;
    };

    const toggleModoAseguradora = () => {
      const fijo = modoAseguradoraEsFijo();
      filaPctAseguradora.style.display = fijo ? 'none' : '';
      filaComisionFijaSeguro.style.display = fijo ? '' : 'none';
      updateHint();
    };

    const updateIGVHint = () => {
      if(!esSeguro(prodSel.value)) return;
      const sym = monedaSel.value==='USD' ? 'US$' : 'S/';
      if(modoAseguradoraEsFijo()){
        const comision = parseFloat(comisionAseguradoraFijaInput.value)||0;
        primaNetaLabelEl.textContent = esAsesoriaModalJS ? 'Comisiones FG 100%' : 'Comisión de la aseguradora';
        primaNetaValorEl.textContent = `${sym} ${comision.toFixed(2)}`;
        comisionEmpresaValorEl.textContent = `${sym} ${comision.toFixed(2)}`;
        return;
      }
      primaNetaLabelEl.textContent = `Prima neta (Prima bruta ÷ ${FACTOR_PRIMA_NETA})`;
      const bruta = parseFloat(primaBrutaInput.value)||0;
      const primaNeta = calcPrimaNeta(bruta);
      const pct = parseFloat(pctAseguradoraInput.value)||0;
      const comision = primaNeta*pct/100;
      primaNetaValorEl.textContent = `${sym} ${primaNeta.toFixed(2)}`;
      comisionEmpresaValorEl.textContent = `${sym} ${comision.toFixed(2)}`;
    };

    const updateHint = () => {
      const tipo = tipoSel.value;
      const sym = monedaSel.value==='USD' ? 'US$' : 'S/';
      label.textContent = tipo==='porcentaje' ? 'Porcentaje (%)' : tipo==='fijo' ? `Monto fijo (${sym})` : 'Valor';
      valorInput.disabled = tipo==='ninguna';
      valorInput.placeholder = tipo==='porcentaje' ? '1 – 100' : tipo==='fijo' ? '70 – 200' : '';
      const total = comisionTotalActual();
      const pctFG = pctFGSel ? (parseFloat(pctFGSel.value)||70) : 70;
      const comisionFGActual = esSeguro(prodSel.value) ? total*pctFG/100 : total;
      const val = parseFloat(valorInput.value)||0;
      let monto = 0;
      if(tipo==='porcentaje') monto = total*val/100; else if(tipo==='fijo') monto = val;
      const fm = n => fmtMonedaVal(n, monedaSel.value);
      comisionAsesorValorEl.textContent = tipo==='ninguna' ? 'S/ 0.00' : fm(monto);
      let txt = tipo==='ninguna' ? 'Esta venta no genera comisión a un asesor.' : `Margen para FG: ${fm(comisionFGActual-monto)}`;
      if(monedaSel.value==='USD') txt += ` (equiv. ${fmtMoney((comisionFGActual-monto)*(Number(state.tipoCambio)||1))} al TC actual)`;
      hint.textContent = txt;
      updateIGVHint();
    };
    tipoSel.onchange = updateHint; valorInput.oninput = updateHint; totalInput.oninput = updateHint; monedaSel.onchange = updateHint;
    primaBrutaInput.oninput = updateHint; pctAseguradoraInput.oninput = updateHint;
    if(comisionAseguradoraFijaInput) comisionAseguradoraFijaInput.oninput = updateHint;
    if(pctFGSel) pctFGSel.onchange = updateHint;
    if(modoComAseguradoraSel) modoComAseguradoraSel.onchange = toggleModoAseguradora;
    updateHint();
    if(modoComAseguradoraSel) toggleModoAseguradora();
    const toggleModoComision = () => {
      const seguro = esSeguro(prodSel.value);
      bloqueSeguro.style.display = seguro ? '' : 'none';
      bloqueFijo.style.display = seguro ? 'none' : '';
      updateHint();
    };
    toggleModoComision();
    prodSel.onchange = () => { if(!editing.id){ tipoSel.value = esSeguro(prodSel.value) ? 'porcentaje' : 'fijo'; } toggleModoComision(); };
    if(vigenciaInicioInput) vigenciaInicioInput.onchange = () => { if(vigenciaInicioInput.value) vigenciaFinInput.value = addYears(vigenciaInicioInput.value, 1); };
    const formaPagoSel = document.getElementById('mFormaPago');
    const filaCuotas = document.getElementById('mFilaCantidadCuotas');
    const cantidadCuotasInput = document.getElementById('mCantidadCuotas');
    const filaSeguimientoCuotas = document.getElementById('mFilaSeguimientoCuotas');
    if(formaPagoSel) formaPagoSel.onchange = () => {
      const enCuotas = formaPagoSel.value==='cupones' || formaPagoSel.value==='debito_automatico';
      if(filaCuotas) filaCuotas.style.display = enCuotas ? '' : 'none';
      if(filaSeguimientoCuotas) filaSeguimientoCuotas.style.display = enCuotas ? '' : 'none';
      if(enCuotas && cantidadCuotasInput && !cantidadCuotasInput.value){
        cantidadCuotasInput.value = formaPagoSel.value==='debito_automatico' ? 12 : 6;
      }
    };
    const tcLink = document.getElementById('mEditarTC');
    if(tcLink) tcLink.onclick = (e) => {
      e.preventDefault();
      const nuevo = prompt('Nuevo tipo de cambio (S/ por US$):', state.tipoCambio);
      if(nuevo && !isNaN(parseFloat(nuevo))){ state.tipoCambio = parseFloat(nuevo); save(); updateHint(); tcLink.parentElement.innerHTML = `Tipo de cambio actualizado: 1 US$ = S/ ${state.tipoCambio.toFixed(2)}`; }
    };
    const btnNuevoAsesor = document.getElementById('mNuevoAsesor');
    if(btnNuevoAsesor) btnNuevoAsesor.onclick = () => {
      const nombre = prompt('Nombre del nuevo asesor:');
      if(nombre && nombre.trim()){
        const a = { id: uid(), nombre: nombre.trim(), telefono:'', email:'', activo:true };
        state.asesores.push(a); save();
        const sel = document.getElementById('mAsesor');
        const opt = document.createElement('option'); opt.value = a.id; opt.textContent = a.nombre; sel.appendChild(opt); sel.value = a.id;
      }
    };
    const btnNuevaAseguradora = document.getElementById('mNuevaAseguradora');
    if(btnNuevaAseguradora) btnNuevaAseguradora.onclick = () => {
      const nombre = prompt('Nombre de la nueva compañía de seguros:');
      if(nombre && nombre.trim()){
        if(!state.aseguradoras.includes(nombre.trim())) state.aseguradoras.push(nombre.trim());
        save();
        const sel = document.getElementById('mAseguradora');
        const opt = document.createElement('option'); opt.value = nombre.trim(); opt.textContent = nombre.trim(); sel.appendChild(opt); sel.value = nombre.trim();
      }
    };
    const btnNuevoProducto = document.getElementById('mNuevoProducto');
    if(btnNuevoProducto) btnNuevoProducto.onclick = () => {
      const nombre = prompt('Nombre del nuevo producto:');
      if(!nombre || !nombre.trim()) return;
      const id = 'custom_' + nombre.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'') + '_' + uid().slice(0,4);
      const bitActual = bitacoraDeTab();
      const grupoNuevo = bitActual==='oncologicos' ? 'oncologico' : bitActual==='asesorias' ? 'asesoria' : undefined;
      const nuevo = { id, label: nombre.trim(), categoria: 'seguro', grupo: grupoNuevo };
      state.productosPersonalizados = state.productosPersonalizados || [];
      state.productosPersonalizados.push(nuevo);
      save();
      const sel = document.getElementById('mProducto');
      const labelOptgroup = bitActual==='oncologicos' ? 'Seguros oncológicos' : bitActual==='asesorias' ? 'Asesoría y consultoría' : 'Seguros';
      const grupoOptgroup = sel.querySelector(`optgroup[label="${labelOptgroup}"]`);
      const opt = document.createElement('option'); opt.value = nuevo.id; opt.textContent = nuevo.label;
      (grupoOptgroup||sel).appendChild(opt);
      sel.value = nuevo.id;
      toggleModoComision();
    };
  }

  const saveBtn = document.getElementById('mSave');
  saveBtn.onclick = () => {
    if(editing.type==='venta'){
      const tipoProductoSel = document.getElementById('mProducto').value;
      let comisionTotal, primaBruta = 0, primaNeta = 0, porcentajeComisionAseguradora = 0;
      const modoComisionAseguradora = document.getElementById('mModoComAseguradora') ? document.getElementById('mModoComAseguradora').value : 'porcentaje';
      if(esSeguro(tipoProductoSel)){
        if(modoComisionAseguradora==='fijo'){
          comisionTotal = parseFloat(document.getElementById('mComisionAseguradoraFija').value)||0;
        } else {
          primaBruta = parseFloat(document.getElementById('mPrimaBruta').value)||0;
          porcentajeComisionAseguradora = parseFloat(document.getElementById('mPctAseguradora').value)||0;
          primaNeta = calcPrimaNeta(primaBruta);
          comisionTotal = primaNeta * porcentajeComisionAseguradora / 100;
        }
      } else {
        comisionTotal = parseFloat(document.getElementById('mComisionTotal').value)||0;
        primaBruta = parseFloat(document.getElementById('mPrimaBrutaFijo').value)||0;
      }
      const data = {
        clienteId: document.getElementById('mCliente').value,
        asesorId: document.getElementById('mAsesor').value || null,
        aseguradora: document.getElementById('mAseguradora').value || '',
        numeroPoliza: document.getElementById('mNumeroPoliza').value.trim(),
        canalVenta: document.getElementById('mCanal').value,
        tipoProducto: tipoProductoSel,
        detalleServicio: document.getElementById('mDetalleServicio').value.trim(),
        tipoVenta: document.getElementById('mTipoVenta').value,
        fechaVenta: document.getElementById('mFecha').value,
        vigenciaInicio: document.getElementById('mVigenciaInicio').value,
        vigenciaFin: document.getElementById('mVigenciaFin').value,
        formaPago: document.getElementById('mFormaPago').value,
        cantidadCuotas: (document.getElementById('mFormaPago').value!=='contado') ? (parseInt(document.getElementById('mCantidadCuotas').value)||null) : null,
        proximaCuotaFecha: (document.getElementById('mFormaPago').value!=='contado') ? document.getElementById('mProximaCuotaFecha').value : '',
        cuotasAlDia: (document.getElementById('mFormaPago').value!=='contado') ? (document.getElementById('mCuotasAlDia').value!=='no') : true,
        comisionTotal, primaBruta, primaNeta, porcentajeComisionAseguradora, modoComisionAseguradora,
        porcentajeFG: esSeguro(tipoProductoSel) ? (parseFloat(document.getElementById('mPctFG').value)||70) : (editing.id ? ((state.ventas.find(x=>x.id===editing.id)||{}).porcentajeFG||70) : 70),
        moneda: document.getElementById('mMoneda').value,
        tipoComisionAsesor: document.getElementById('mTipoComAsesor').value,
        valorComisionAsesor: parseFloat(document.getElementById('mValorComAsesor').value)||0,
        estadoVenta: document.getElementById('mEstadoVenta').value,
        estadoComision: document.getElementById('mEstadoPago').value,
        notas: document.getElementById('mNotas').value,
      };
      if(pendingPolizaPDF!==undefined){
        if(pendingPolizaPDF===null){ data.polizaPDFNombre=''; data.polizaPDFData=''; }
        else { data.polizaPDFNombre = pendingPolizaPDF.name; data.polizaPDFData = pendingPolizaPDF.dataUrl; }
      }
      if(!data.clienteId){ alert('Selecciona un cliente.'); return; }
      if(esSeguro(tipoProductoSel) && !data.aseguradora){ alert('Selecciona la aseguradora.'); return; }
      if(esSeguro(tipoProductoSel) && modoComisionAseguradora!=='fijo' && !data.primaBruta){ alert('Ingresa la prima bruta para calcular la comisión.'); return; }
      if(!data.comisionTotal || data.comisionTotal<=0){ alert('Ingresa un monto de comisión válido (mayor a 0).'); return; }
      if(editing.id){
        const existing = state.ventas.find(v=>v.id===editing.id);
        if(data.estadoComision==='pagada' && existing.estadoComision!=='pagada') data.fechaPagoComision = todayISO();
        if(data.estadoComision==='pendiente') data.fechaPagoComision = '';
        Object.assign(existing, data);
      } else {
        data.id = uid(); data.folio = ++state.folioVenta;
        data.fechaPagoComision = data.estadoComision==='pagada' ? todayISO() : '';
        state.ventas.push(data);
      }
    }
    if(editing.type==='poliza'){
      const data = {
        ventaId: document.getElementById('mVenta').value,
        numeroPoliza: document.getElementById('mNumero').value.trim(),
        aseguradora: document.getElementById('mAseguradora').value.trim(),
        fechaEmision: document.getElementById('mEmision').value,
        fechaVencimiento: document.getElementById('mVencimiento').value,
        notas: document.getElementById('mNotas').value,
      };
      if(!data.ventaId){ alert('Selecciona la venta asociada a esta póliza.'); return; }
      if(editing.id){ Object.assign(state.polizas.find(p=>p.id===editing.id), data); }
      else{ data.id = uid(); data.folio = ++state.folioPoliza; state.polizas.push(data); }
    }
    if(editing.type==='asesor'){
      const data = { nombre: document.getElementById('mNombre').value.trim(), telefono: document.getElementById('mTelefono').value.trim(), email: document.getElementById('mEmail').value.trim() };
      if(!data.nombre){ alert('Escribe el nombre del asesor.'); return; }
      const usuario = document.getElementById('mUsuario').value.trim();
      const clave = document.getElementById('mClaveAsesor').value;
      if(usuario && !clave && !(editing.id && state.asesores.find(a=>a.id===editing.id)?.passwordHash)){ alert('Escribe una contraseña para crear el acceso.'); return; }
      if(usuario){
        const yaUsado = state.asesores.find(a=>a.usuario && a.usuario.toLowerCase()===usuario.toLowerCase() && a.id!==editing.id);
        if(yaUsado || usuario.toLowerCase()===state.auth.email.toLowerCase()){ alert('Ese correo de acceso ya está en uso.'); return; }
        data.usuario = usuario;
        if(clave) data.passwordHash = hashSimple(clave);
        const chkActivo = document.getElementById('mAccesoActivo');
        data.accesoActivo = chkActivo ? chkActivo.checked : true;
      } else {
        data.usuario = null; data.passwordHash = null; data.accesoActivo = true;
      }
      if(editing.id){ Object.assign(state.asesores.find(a=>a.id===editing.id), data); }
      else{ data.id = uid(); data.activo = true; state.asesores.push(data); }
    }
    if(editing.type==='cliente'){
      const data = { nombre: document.getElementById('mNombre').value.trim(), documento: document.getElementById('mDocumento').value.trim(), direccion: document.getElementById('mDireccion').value.trim(), ciudad: document.getElementById('mCiudad').value, celular1: document.getElementById('mCelular1').value.trim(), celular2: document.getElementById('mCelular2').value.trim(), email: document.getElementById('mEmail').value.trim(), email2: document.getElementById('mEmail2').value.trim(), personaContacto: document.getElementById('mPersonaContacto').value.trim(),
        fechaNacimiento: document.getElementById('mFechaNacimiento').value,
        tipoSeguro: document.getElementById('mTipoSeguro').value,
        aseguradoraPreferida: document.getElementById('mAseguradoraPreferida').value,
        numeroPoliza: document.getElementById('mNumeroPolizaCliente').value.trim(),
        inicioVigencia: document.getElementById('mInicioVigenciaCliente').value,
        formaPago: document.getElementById('mFormaPagoCliente').value,
        vehiculoMarca: document.getElementById('mVehiculoMarca').value.trim(),
        vehiculoModelo: document.getElementById('mVehiculoModelo').value.trim(),
        vehiculoAnio: document.getElementById('mVehiculoAnio').value,
        placa: document.getElementById('mPlaca').value.trim(),
        usoVehiculo: document.getElementById('mUsoVehiculo').value,
        bancoEndosatario: document.getElementById('mBancoEndosatario').value.trim(),
        sumaAsegurada: document.getElementById('mSumaAsegurada').value,
        motor: document.getElementById('mMotor').value.trim(),
        chasis: document.getElementById('mChasis').value.trim(),
        estadoContacto: document.getElementById('mEstadoContacto').value,
        datosAdicionales: document.getElementById('mDatosAdicionales').value.trim(),
      };
      if(!data.nombre){ alert('Escribe el nombre del cliente.'); return; }
      if(editing.id){ Object.assign(state.clientes.find(c=>c.id===editing.id), data); }
      else{ data.id = uid(); state.clientes.push(data); }
      if(editing.returnTo==='venta'){ const newId = editing.id || data.id; editing = { type:'venta', id: editing.ventaEditId||null, productoFijo: editing.productoFijo, preselectClienteId: newId }; render(); return; }
    }
    if(editing.type==='metas'){
      state.metas.general = parseFloat(document.getElementById('mMetaGeneral').value)||0;
      document.querySelectorAll('[data-meta-asesor]').forEach(inp=>{
        state.metas.porAsesor[inp.dataset.metaAsesor] = parseFloat(inp.value)||0;
      });
    }
    save(); closeModal(); render();
  };
}

const origRender = render;
render = function(){
  origRender();
  if(tab==='dashboard') wireDashboard();
  if(tab==='ventas_seguros' || tab==='ventas_oncologicos' || tab==='ventas_asesorias') wireVentas();
  if(tab==='cobro_comisiones') wireCobroComisiones();
  if(tab==='pago_comisiones') wirePagoComisiones();
  if(tab==='polizas') wirePolizas();
  if(tab==='renovaciones') wireRenovaciones();
  if(tab==='asesores') wireAsesores();
  if(tab==='clientes') wireClientes();
};

load();
})();
</script>
